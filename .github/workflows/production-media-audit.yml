name: production-media-audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: production-read-only
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --include=optional
      - name: Read-only production media inventory
        run: npx tsx scripts/audit-production-media.ts production-media-inventory.json
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          PRODUCTION_KV_REST_API_URL: ${{ secrets.PRODUCTION_KV_REST_API_URL }}
          PRODUCTION_KV_REST_API_READ_ONLY_TOKEN: ${{ secrets.PRODUCTION_KV_REST_API_READ_ONLY_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.PRODUCTION_R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.PRODUCTION_R2_READ_ONLY_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.PRODUCTION_R2_READ_ONLY_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.PRODUCTION_R2_BUCKET_NAME }}
          R2_PUBLIC_BASE_URL: ${{ vars.PRODUCTION_R2_PUBLIC_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: production-media-inventory-${{ github.run_id }}
          path: website/production-media-inventory.json
          retention-days: 7
