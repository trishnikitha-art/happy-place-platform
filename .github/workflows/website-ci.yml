name: website-ci

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test
      # Lint is security-critical for this codebase - no escape hatch
      - run: npm run lint

  oauth-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Validate required secrets are present
        run: |
          echo "Validating required GitHub Actions secrets..."
          required_secrets=("KV_REST_API_URL" "KV_REST_API_TOKEN" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "GOOGLE_REDIRECT_URI" "ENCRYPTION_KEY")
          missing_secrets=()
          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              missing_secrets+=("$secret")
            fi
          done
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required GitHub Actions secrets:"
            for secret in "${missing_secrets[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "To fix this, add the missing secrets in your GitHub repository:"
            echo "  1. Go to Settings → Secrets and variables → Actions"
            echo "  2. Click 'New repository secret'"
            echo "  3. Add each missing secret with its value from your Vercel environment"
            echo ""
            echo "These secrets must match your Vercel production environment."
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      - name: Verify secrets are not empty
        run: |
          echo "Verifying secrets are not empty..."
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_TOKEN" ] || [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REDIRECT_URI" ] || [ -z "$ENCRYPTION_KEY" ]; then
            echo "❌ ERROR: One or more secrets are empty strings"
            exit 1
          fi
          echo "✅ All secrets have non-empty values"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      - name: Run OAuth tests with Redis, encryption, and Google credentials
        run: npm run test:oauth
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
