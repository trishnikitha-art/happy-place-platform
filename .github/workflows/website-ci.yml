name: website-ci

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npm run build
      - run: node --test scripts/image-qa/references.test.mjs
      - run: npm run qa:images
      - run: npm test
      # Lint is security-critical for this codebase - no escape hatch
      - run: npm run lint

  oauth-tests:
    runs-on: ubuntu-latest
    # Ephemeral real Redis with an Upstash REST-compatible transport.
    # These test-only credentials never select a production database/account.
    services:
      redis:
        image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis-http:
        image: hiett/serverless-redis-http@sha256:5b0bb9239fce53abf87b2018a7a0deb9ec7bd900c5360738fe5fbeeb426f9150
        env:
          SRH_MODE: env
          SRH_TOKEN: hpp-isolated-ci-token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports:
          - 8079:80
    env:
      KV_REST_API_URL: http://127.0.0.1:8079
      KV_REST_API_TOKEN: hpp-isolated-ci-token
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ENCRYPTION_KEY_V1: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
      GOOGLE_CLIENT_ID: ci-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-oauth-secret-no-google
      GOOGLE_REDIRECT_URI: http://127.0.0.1:3100/api/drive/oauth/callback
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - name: Prove isolated Redis service is reachable
        id: ci-config
        run: |
          node --input-type=module <<'JS'
          import { Redis } from '@upstash/redis';
          const client = new Redis({ url: process.env.KV_REST_API_URL, token: process.env.KV_REST_API_TOKEN });
          if (await client.ping() !== 'PONG') throw new Error('Isolated Redis PING failed');
          console.log('Isolated real Redis reachable; no production credentials used.');
          JS
      - name: Run OAuth unit tests with Redis mocks
        run: npx jest --config jest.oauth.unit.config.ts
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # Unit tests DO NOT use real Redis - they use mocks
      - name: Phase A - Run Redis-backed integration tests
        id: phase-a-tests
        run: |
          set -e
          set -o pipefail
          npx jest --config jest.oauth.integration.config.ts --runInBand --verbose --no-coverage 2>&1 | tee phase-a-test-output.log
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          REDIS_INTEGRATION_TESTS_ENABLED: 'true'
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
          # Phase A: No NEXT_PUBLIC_TEST_BASE_URL - HTTP tests will defer
          # --runInBand: Run tests serially to avoid Redis credential mutation conflicts
      - name: Upload Phase A test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-test-output-${{ github.run_id }}
          path: website/phase-a-test-output.log
          retention-days: 7
      - name: Phase B - Build application for HTTP integration tests
        run: npm run build
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Start Next.js server for HTTP integration tests
        run: |
          mkdir -p logs
          nohup npm start -- --port 3100 > logs/server.log 2>&1 &
          echo $! > logs/server.pid
          echo "Server started with PID: $(cat logs/server.pid)"
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          VERCEL_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          PORT: 3100
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Wait for server readiness
        run: |
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -s http://127.0.0.1:3100/api/health > /dev/null; do sleep 2; done'
          echo "Server health check passed"
          # Verify Workbench route is loaded
          timeout 10 bash -c 'until curl -s http://127.0.0.1:3100/api/workbench/auth-status > /dev/null; do sleep 2; done'
          echo "Workbench route verified"
          # Verify Drive route is loaded
          timeout 10 bash -c 'until curl -s http://127.0.0.1:3100/api/drive/auth/status > /dev/null; do sleep 2; done'
          echo "Drive route verified"
          echo "Server is ready for HTTP integration tests"
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Run HTTP security integration tests
        id: phase-b-tests
        run: |
          set -e
          set -o pipefail
          npx jest --config jest.http.integration.config.ts --runInBand --verbose --no-coverage 2>&1 | tee phase-b-test-output.log
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          VERCEL_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          REDIS_INTEGRATION_TESTS_ENABLED: 'true'
          NEXT_PUBLIC_TEST_BASE_URL: http://127.0.0.1:3100
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
          # Phase B: NEXT_PUBLIC_TEST_BASE_URL set - HTTP tests will run
      - name: Upload Phase B test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-test-output-${{ github.run_id }}
          path: website/phase-b-test-output.log
          retention-days: 7
      - name: Upload Phase B server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-server-log-${{ github.run_id }}
          path: website/logs/server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Phase B - Terminate Next.js server
        if: always()
        run: |
          if [ -f logs/server.pid ]; then
            pid=$(cat logs/server.pid)
            kill $pid || true
            rm logs/server.pid
            echo "Server terminated (PID: $pid)"
          fi
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ env.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ env.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ env.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ env.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: "hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Cleanup CI test namespace
        if: always() && steps.ci-config.outcome == 'success'
        run: |
          echo "Cleaning up CI test namespace: hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:"
          # Scan and delete all keys in the run-scoped namespace
          node -e "
            const { Redis } = require('@upstash/redis');
            const redis = new Redis({
              url: process.env.KV_REST_API_URL,
              token: process.env.KV_REST_API_TOKEN
            });
            const namespace = 'hpp:ci-test:${{ github.run_id }}:${{ github.run_attempt }}:';
            let cursor = '0';
            let deleted = 0;
            (async () => {
              do {
                const result = await redis.scan(cursor, { match: namespace + '*', count: 100 });
                cursor = result[0];
                const keys = result[1];
                if (keys.length > 0) {
                  await redis.del(...keys);
                  deleted += keys.length;
                }
              } while (cursor !== '0');
              console.log('Deleted', deleted, 'keys from namespace:', namespace);
            })().catch(err => {
              console.error('Cleanup error:', err);
              process.exit(1);
            });
          "
        env:
          KV_REST_API_URL: ${{ env.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ env.KV_REST_API_TOKEN }}
