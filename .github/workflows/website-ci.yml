name: website-ci

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - run: npm run build
      - run: node --test scripts/image-qa/references.test.mjs
      - run: npm run qa:images
      - run: npm test
      # Lint is security-critical for this codebase - no escape hatch
      - run: npm run lint

  oauth-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --include=optional
      - name: Validate required secrets are present
        run: |
          echo "Validating required GitHub Actions secrets..."
          required_secrets=("KV_REST_API_URL" "KV_REST_API_TOKEN" "GOOGLE_CLIENT_ID" "GOOGLE_CLIENT_SECRET" "GOOGLE_REDIRECT_URI" "ENCRYPTION_KEY")
          missing_secrets=()
          for secret in "${required_secrets[@]}"; do
            if [ -z "${!secret}" ]; then
              missing_secrets+=("$secret")
            fi
          done
          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "❌ ERROR: Missing required GitHub Actions secrets:"
            for secret in "${missing_secrets[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "To fix this, add the missing secrets in your GitHub repository:"
            echo "  1. Go to Settings → Secrets and variables → Actions"
            echo "  2. Click 'New repository secret'"
            echo "  3. Add each missing secret with its value from your Vercel environment"
            echo ""
            echo "These secrets must match your Vercel production environment."
            exit 1
          fi
          echo "✅ All required secrets are present"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      - name: Verify secrets are not empty
        run: |
          echo "Verifying secrets are not empty..."
          if [ -z "$KV_REST_API_URL" ] || [ -z "$KV_REST_API_TOKEN" ] || [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ] || [ -z "$GOOGLE_REDIRECT_URI" ] || [ -z "$ENCRYPTION_KEY" ]; then
            echo "❌ ERROR: One or more secrets are empty strings"
            exit 1
          fi
          echo "✅ All required secrets have non-empty values"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      - name: Validate corpus authorization configuration
        run: |
          echo "Validating corpus authorization configuration..."
          # Check if corpus configuration is present (values are not validated for security)
          if [ -z "$HPP_AUTHORIZED_MY_DRIVE" ] && [ -z "$HPP_AUTHORIZED_SHARED_DRIVES" ]; then
            echo "⚠️  WARNING: Neither HPP_AUTHORIZED_MY_DRIVE nor HPP_AUTHORIZED_SHARED_DRIVES is configured"
            echo "Drive corpus access will be blocked until corpus authorization is configured"
            echo "This is a safe fail-closed state, but may prevent Drive operations"
          else
            echo "✅ Corpus authorization configuration present"
          fi
        env:
          HPP_AUTHORIZED_MY_DRIVE: ${{ secrets.HPP_AUTHORIZED_MY_DRIVE }}
          HPP_AUTHORIZED_SHARED_DRIVES: ${{ secrets.HPP_AUTHORIZED_SHARED_DRIVES }}
      - name: Validate Workbench principal configuration
        run: |
          echo "Validating Workbench principal configuration..."
          # HPP_WORKBENCH_PRINCIPAL_ID is required for Drive authorization binding in production
          # CI uses ci-workbench-principal for testing, so production secret is optional in CI
          if [ -z "$HPP_WORKBENCH_PRINCIPAL_ID" ]; then
            echo "⚠️  WARNING: HPP_WORKBENCH_PRINCIPAL_ID is not configured in GitHub Actions secrets"
            echo "CI will use test principal (ci-workbench-principal) for OAuth tests"
            echo "Production deployment requires HPP_WORKBENCH_PRINCIPAL_ID to be configured in Vercel"
          else
            echo "✅ HPP_WORKBENCH_PRINCIPAL_ID is configured"
          fi
        env:
          HPP_WORKBENCH_PRINCIPAL_ID: ${{ secrets.HPP_WORKBENCH_PRINCIPAL_ID }}
      - name: Run OAuth unit tests with Redis mocks
        run: npx jest --config jest.oauth.unit.config.ts
        env:
          NODE_ENV: test
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # Unit tests DO NOT use real Redis - they use mocks
      - name: Phase A - Run Redis-backed integration tests
        id: phase-a-tests
        run: |
          set -e
          set -o pipefail
          npx jest --config jest.oauth.integration.config.ts --runInBand --verbose --no-coverage 2>&1 | tee phase-a-test-output.log
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          REDIS_INTEGRATION_TESTS_ENABLED: 'true'
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
          # Phase A: No NEXT_PUBLIC_TEST_BASE_URL - HTTP tests will defer
          # --runInBand: Run tests serially to avoid Redis credential mutation conflicts
      - name: Upload Phase A test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-a-test-output-${{ github.run_id }}
          path: website/phase-a-test-output.log
          retention-days: 7
      - name: Phase B - Build application for HTTP integration tests
        run: npm run build
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Start Next.js server for HTTP integration tests
        run: |
          mkdir -p logs
          nohup npm start -- --port 3100 > logs/server.log 2>&1 &
          echo $! > logs/server.pid
          echo "Server started with PID: $(cat logs/server.pid)"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          PORT: 3100
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Wait for server readiness
        run: |
          echo "Waiting for server to be ready..."
          timeout 60 bash -c 'until curl -s http://127.0.0.1:3100/api/health > /dev/null; do sleep 2; done'
          echo "Server health check passed"
          # Verify Workbench route is loaded
          timeout 10 bash -c 'until curl -s http://127.0.0.1:3100/api/workbench/auth-status > /dev/null; do sleep 2; done'
          echo "Workbench route verified"
          # Verify Drive route is loaded
          timeout 10 bash -c 'until curl -s http://127.0.0.1:3100/api/drive/auth/status > /dev/null; do sleep 2; done'
          echo "Drive route verified"
          echo "Server is ready for HTTP integration tests"
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Run HTTP security integration tests
        id: phase-b-tests
        run: |
          set -e
          set -o pipefail
          npx jest --config jest.http.integration.config.ts --runInBand --verbose --no-coverage 2>&1 | tee phase-b-test-output.log
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          REDIS_INTEGRATION_TESTS_ENABLED: 'true'
          NEXT_PUBLIC_TEST_BASE_URL: http://127.0.0.1:3100
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
          # Phase B: NEXT_PUBLIC_TEST_BASE_URL set - HTTP tests will run
      - name: Upload Phase B test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-test-output-${{ github.run_id }}
          path: website/phase-b-test-output.log
          retention-days: 7
      - name: Upload Phase B server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-b-server-log-${{ github.run_id }}
          path: website/logs/server.log
          if-no-files-found: warn
          retention-days: 7
      - name: Phase B - Terminate Next.js server
        if: always()
        run: |
          if [ -f logs/server.pid ]; then
            pid=$(cat logs/server.pid)
            kill $pid || true
            rm logs/server.pid
            echo "Server terminated (PID: $pid)"
          fi
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          NODE_ENV: test
          TEST_NAMESPACE: hpp:ci-test:${{ github.run_id }}
          # CI-only test credentials for Workbench (not production secrets)
          WORKBENCH_PASSWORD: ci-workbench-password-not-production
          HPP_WORKBENCH_PRINCIPAL_ID: ci-workbench-principal
      - name: Phase B - Cleanup CI test namespace
        if: always()
        run: |
          echo "Cleaning up CI test namespace: hpp:ci-test:${{ github.run_id }}"
          # Scan and delete all keys in the run-scoped namespace
          node -e "
            const { Redis } = require('@upstash/redis');
            const redis = new Redis({
              url: process.env.KV_REST_API_URL,
              token: process.env.KV_REST_API_TOKEN
            });
            const namespace = 'hpp:ci-test:${{ github.run_id }}';
            let cursor = '0';
            let deleted = 0;
            (async () => {
              do {
                const result = await redis.scan(cursor, { match: namespace + '*', count: 100 });
                cursor = result[0];
                const keys = result[1];
                if (keys.length > 0) {
                  await redis.del(...keys);
                  deleted += keys.length;
                }
              } while (cursor !== '0');
              console.log('Deleted', deleted, 'keys from namespace:', namespace);
            })().catch(err => {
              console.error('Cleanup error:', err);
              process.exit(1);
            });
          "
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
      - name: Phase C - Diagnose malformed production media record
        run: |
          echo "Diagnosing malformed production media record 07c0eae184dc5a375f943a3ac2b67e95"
          echo "Using application's namespace construction to ensure key accuracy"
          npx tsx scripts/diagnose-production-media-via-app-namespace.mjs
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          VERCEL_ENV: production
