name: Vercel Production Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Test secret availability
        run: |
          echo "Testing secret availability..."
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "✅ VERCEL_TOKEN is available"
            echo "Token length: ${#VERCEL_TOKEN}"
          else
            echo "❌ VERCEL_TOKEN is not available"
            exit 1
          fi
          
          if [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "✅ VERCEL_PROJECT_ID is available"
            echo "Project ID: $VERCEL_PROJECT_ID"
          else
            echo "❌ VERCEL_PROJECT_ID is not available"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
