name: Vercel Production Deployment

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/vercel-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel Production
        run: |
          # This workflow triggers Vercel deployment via REST API
          # Used as fallback when Git webhook integration fails
          # Requires VERCEL_TOKEN and VERCEL_PROJECT_ID secrets
          
          echo "Checking secrets..."
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN secret is not set"
            exit 1
          fi
          
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID secret is not set"
            exit 1
          fi
          
          echo "✅ Secrets are available"
          echo "Project ID: $VERCEL_PROJECT_ID"
          
          echo "Testing Vercel API connection..."
          # First test with a simple API call to verify token works
          curl -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID" || { echo "❌ Failed to connect to Vercel API"; exit 1; }
          
          echo "✅ API connection successful"
          
          echo "Attempting to trigger deployment..."
          # Trigger deployment via Vercel REST API
          RESPONSE=$(curl -X POST \
            "https://api.vercel.com/v13/deployments" \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"name\": \"website\",
              \"projectId\": \"$VERCEL_PROJECT_ID\",
              \"target\": \"production\",
              \"gitSource\": {
                \"type\": \"github\",
                \"ref\": \"main\",
                \"repo\": {
                  \"owner\": \"trishnikitha-art\",
                  \"repo\": \"happy-place-platform\"
                }
              }
            }")
          
          echo "Response: $RESPONSE"
          
          # Check if deployment was created
          if echo "$RESPONSE" | grep -q '"id"'; then
            echo "✅ Deployment triggered successfully"
            DEPLOYMENT_ID=$(echo "$RESPONSE" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "Deployment ID: $DEPLOYMENT_ID"
          else
            echo "❌ Failed to trigger deployment"
            echo "Response: $RESPONSE"
            exit 1
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}